name: Build and Publish Unsigned DMG

on:
  push:
    branches:
      - main
    paths-ignore:
      - 'Stereograms/**'
      - 'README.md'
      - 'ADDING_IMAGES.md'
      - 'PRIVACY.md'
      - 'LICENSE'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: macos-latest
    env:
      PROJECT_FILE: EyeHeaven/EyeHeaven.xcodeproj/project.pbxproj
      BUILD_SCRIPT: scripts/build_local_dmg.sh
      RELEASE_ENABLED: ${{ vars.RELEASE_ENABLED }}

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Inspect bootstrap state
        id: bootstrap
        shell: bash
        run: |
          set -euo pipefail

          has_project=false
          has_script=false
          release_enabled=false

          if [[ -f "$PROJECT_FILE" ]]; then
            has_project=true
          fi

          if [[ -f "$BUILD_SCRIPT" ]]; then
            has_script=true
          fi

          if [[ "${RELEASE_ENABLED:-}" == "true" ]]; then
            release_enabled=true
          fi

          echo "has_project=$has_project" >> "$GITHUB_OUTPUT"
          echo "has_script=$has_script" >> "$GITHUB_OUTPUT"
          echo "release_enabled=$release_enabled" >> "$GITHUB_OUTPUT"

      - name: Resolve version and release gate
        id: gate
        if: steps.bootstrap.outputs.has_project == 'true' && steps.bootstrap.outputs.has_script == 'true'
        shell: bash
        run: |
          set -euo pipefail

          MARKETING_VERSION="$(xcodebuild -project EyeHeaven/EyeHeaven.xcodeproj -scheme EyeHeaven -showBuildSettings | awk -F ' = ' '/MARKETING_VERSION/ { print $2; exit }')"
          if [[ -z "$MARKETING_VERSION" ]]; then
            echo "Failed to resolve MARKETING_VERSION" >&2
            exit 1
          fi

          LATEST_VERSION="$(git tag -l 'v*' | sed 's/^v//' | grep -E '^[0-9]+\.[0-9]+\.[0-9]+$' | sort -V | tail -n1 || true)"

          SHOULD_RELEASE=false
          if [[ -z "$LATEST_VERSION" ]]; then
            SHOULD_RELEASE=true
          elif [[ "$MARKETING_VERSION" != "$LATEST_VERSION" ]]; then
            MAX_VERSION="$(printf '%s\n%s\n' "$LATEST_VERSION" "$MARKETING_VERSION" | sort -V | tail -n1)"
            if [[ "$MAX_VERSION" == "$MARKETING_VERSION" ]]; then
              SHOULD_RELEASE=true
            fi
          fi

          echo "marketing_version=$MARKETING_VERSION" >> "$GITHUB_OUTPUT"
          echo "latest_version=$LATEST_VERSION" >> "$GITHUB_OUTPUT"
          echo "should_release=$SHOULD_RELEASE" >> "$GITHUB_OUTPUT"

      - name: Skip release (bootstrap main)
        if: steps.bootstrap.outputs.has_project != 'true' || steps.bootstrap.outputs.has_script != 'true'
        run: |
          echo "Skipping release: bootstrap main does not contain app sources yet."

      - name: Skip release (disabled)
        if: steps.bootstrap.outputs.has_project == 'true' && steps.bootstrap.outputs.has_script == 'true' && steps.bootstrap.outputs.release_enabled != 'true'
        run: |
          echo "Skipping release: repository variable RELEASE_ENABLED is not true."

      - name: Skip release (version did not increase)
        if: steps.bootstrap.outputs.has_project == 'true' && steps.bootstrap.outputs.has_script == 'true' && steps.bootstrap.outputs.release_enabled == 'true' && steps.gate.outputs.should_release != 'true'
        run: |
          echo "No release: MARKETING_VERSION=${{ steps.gate.outputs.marketing_version }}, latest tag version=${{ steps.gate.outputs.latest_version }}"

      - name: Build DMG
        if: steps.bootstrap.outputs.has_project == 'true' && steps.bootstrap.outputs.has_script == 'true' && steps.bootstrap.outputs.release_enabled == 'true' && steps.gate.outputs.should_release == 'true'
        env:
          CHANNEL: ${{ steps.gate.outputs.marketing_version }}
          CODE_SIGNING_ALLOWED: 'NO'
          CODE_SIGNING_REQUIRED: 'NO'
          CODE_SIGN_IDENTITY: ''
        run: |
          chmod +x scripts/build_local_dmg.sh
          ./scripts/build_local_dmg.sh

      - name: Upload artifacts to release
        if: steps.bootstrap.outputs.has_project == 'true' && steps.bootstrap.outputs.has_script == 'true' && steps.bootstrap.outputs.release_enabled == 'true' && steps.gate.outputs.should_release == 'true'
        uses: softprops/action-gh-release@v3
        with:
          tag_name: v${{ steps.gate.outputs.marketing_version }}
          name: EyeHeaven v${{ steps.gate.outputs.marketing_version }}
          make_latest: true
          generate_release_notes: true
          body: |
            Automated unsigned build from main.

            Version: ${{ steps.gate.outputs.marketing_version }}

            Important:
            - This DMG is not notarized.
            - macOS may show an unidentified developer warning on first launch.
            - See README installation instructions for unsigned builds.
          files: |
            dist/*.dmg
            dist/*.sha256
            dist/catalog.json
