name: PR Checks

on:
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-and-unit-tests:
    name: Build and Unit Tests
    runs-on: macos-latest
    env:
      PROJECT_FILE: EyeHeaven/EyeHeaven.xcodeproj/project.pbxproj

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Inspect app sources
        id: sources
        shell: bash
        run: |
          set -euo pipefail

          has_project=false
          if [[ -f "$PROJECT_FILE" ]]; then
            has_project=true
          fi

          echo "has_project=$has_project" >> "$GITHUB_OUTPUT"

      - name: Skip build and tests (bootstrap PR)
        if: steps.sources.outputs.has_project != 'true'
        run: |
          echo "Skipping build and tests: PR head does not contain app sources yet."

      - name: Build (Debug)
        if: steps.sources.outputs.has_project == 'true'
        run: |
          set -euo pipefail
          xcodebuild \
            -project EyeHeaven/EyeHeaven.xcodeproj \
            -scheme EyeHeaven \
            -configuration Debug \
            build

      - name: Run Unit Tests
        if: steps.sources.outputs.has_project == 'true'
        run: |
          set -euo pipefail
          xcodebuild \
            -project EyeHeaven/EyeHeaven.xcodeproj \
            -scheme EyeHeaven \
            -destination 'platform=macOS' \
            -only-testing:EyeHeavenTests \
            test

  version-gate:
    name: MARKETING_VERSION Gate
    runs-on: ubuntu-latest
    env:
      PROJECT_FILE: EyeHeaven/EyeHeaven.xcodeproj/project.pbxproj

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Ensure MARKETING_VERSION increased
        shell: bash
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          set -euo pipefail

          if [[ ! -f "$PROJECT_FILE" ]]; then
            echo "Skipping version gate: PR head does not contain app sources yet."
            exit 0
          fi

          HEAD_VERSION="$(awk -F ' = ' '/MARKETING_VERSION/ { gsub(/;/, "", $2); print $2; exit }' "$PROJECT_FILE")"

          if git cat-file -e "$BASE_SHA:$PROJECT_FILE" 2>/dev/null; then
            BASE_CONTENT="$(git show "$BASE_SHA:$PROJECT_FILE")"
            BASE_VERSION="$(printf '%s\n' "$BASE_CONTENT" | awk -F ' = ' '/MARKETING_VERSION/ { gsub(/;/, "", $2); print $2; exit }')"
          else
            BASE_VERSION="0.0.0"
            echo "Bootstrap base detected: $PROJECT_FILE is missing in base branch, using base version $BASE_VERSION"
          fi

          if [[ -z "$HEAD_VERSION" || -z "$BASE_VERSION" ]]; then
            echo "Failed to resolve MARKETING_VERSION (base='$BASE_VERSION', head='$HEAD_VERSION')." >&2
            exit 1
          fi

          if [[ ! "$HEAD_VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "HEAD MARKETING_VERSION '$HEAD_VERSION' is not semver X.Y.Z" >&2
            exit 1
          fi

          if [[ ! "$BASE_VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "BASE MARKETING_VERSION '$BASE_VERSION' is not semver X.Y.Z" >&2
            exit 1
          fi

          MAX_VERSION="$(printf '%s\n%s\n' "$BASE_VERSION" "$HEAD_VERSION" | sort -V | tail -n1)"

          if [[ "$HEAD_VERSION" == "$BASE_VERSION" ]]; then
            echo "MARKETING_VERSION must be increased for merge to main. Current: $HEAD_VERSION" >&2
            exit 1
          fi

          if [[ "$MAX_VERSION" != "$HEAD_VERSION" ]]; then
            echo "MARKETING_VERSION must be greater than base. base=$BASE_VERSION head=$HEAD_VERSION" >&2
            exit 1
          fi

          echo "Version gate passed: base=$BASE_VERSION -> head=$HEAD_VERSION"
